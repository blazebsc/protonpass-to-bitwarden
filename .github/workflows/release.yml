name: Build release artifacts

on:
  workflow_dispatch:
  # Any Cargo.toml push is a candidate; the `version` job below decides whether
  # the package version actually moved past the newest tag.
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -C debuginfo=0

jobs:
  version:
    name: Read package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - name: Check out source (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve version and skip work for an already released version
        id: read
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --quiet \
            | jq -r '.packages[] | select(.name == "protonpass-to-bitwarden") | .version')"
          test -n "$version"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::package version $version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists, this run builds artifacts only"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag is new, this run will publish a release"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - name: Check out source (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js 22 (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check independent validator syntax
        run: node --check scripts/validate-bitwarden-output.mjs
      - name: Test
        run: cargo test --locked --all
      - name: Validate a generated nonzero-passkey export
        run: cargo test --locked --test cli independent_validator_checks_generated_nonzero_passkey -- --exact

  minimum-rust:
    name: Verify minimum Rust 1.88.0
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check all targets with the declared minimum Rust
        run: cargo +1.88.0 check --locked --all-targets --all-features

  dependency-audit:
    name: Verify dependency policy
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
      - name: Prove the ignored RSA package is unreachable
        shell: bash
        run: |
          set -euo pipefail
          rsa_tree="$(cargo tree --locked --target all -i rsa -e normal)"
          test -z "$rsa_tree"

  build:
    name: Build ${{ matrix.target }}
    needs:
      - version
      - verify
      - minimum-rust
      - dependency-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: protonpass-to-bitwarden-linux-x86_64
            executable: protonpass-to-bitwarden
            rustflags: -C debuginfo=0
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: protonpass-to-bitwarden-macos-x86_64
            executable: protonpass-to-bitwarden
            rustflags: -C debuginfo=0
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: protonpass-to-bitwarden-macos-aarch64
            executable: protonpass-to-bitwarden
            rustflags: -C debuginfo=0
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: protonpass-to-bitwarden-windows-x86_64
            executable: protonpass-to-bitwarden.exe
            # The MSVC linker embeds a timestamp and a PDB GUID unless /Brepro is
            # given, so without this the reproducible-binary check never passes.
            rustflags: -C debuginfo=0 -C link-arg=/Brepro
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Check out source (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain and target
        run: rustup target add ${{ matrix.target }}
      - name: Set deterministic source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build first copy
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage first copy
        shell: bash
        run: |
          mkdir -p dist/scripts dist/tests dist/aidocs
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.executable }}"
          cp README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md LICENSE Cargo.toml Cargo.lock rust-toolchain.toml dist/
          cp scripts/validate-bitwarden-output.mjs scripts/validate-bitwarden-importer.sh dist/scripts/
          cp tests/bitwarden-json-importer.bridge.spec.ts dist/tests/
          cp aidocs/security-audit-2026-08-13.md dist/aidocs/
      - name: Rebuild from a clean workspace target directory
        shell: bash
        run: |
          cargo clean
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify reproducible binary
        shell: bash
        run: |
          set -euo pipefail
          staged="dist/${{ matrix.executable }}"
          rebuilt="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          if command -v sha256sum >/dev/null 2>&1; then
            hash() { sha256sum "$1" | cut -d' ' -f1; }
          else
            hash() { shasum -a 256 "$1" | cut -d' ' -f1; }
          fi
          echo "staged  $(hash "$staged")  $(wc -c < "$staged") bytes"
          echo "rebuilt $(hash "$rebuilt")  $(wc -c < "$rebuilt") bytes"
          cmp -s "$staged" "$rebuilt"
      - name: Record build provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "target=${{ matrix.target }}"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown}"
            echo "[rustc]"
            rustc --version --verbose
            echo "[cargo]"
            cargo --version --verbose
          } > dist/BUILDINFO.txt
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "${{ matrix.executable }}"
            README.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
            LICENSE
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            scripts/validate-bitwarden-output.mjs
            scripts/validate-bitwarden-importer.sh
            tests/bitwarden-json-importer.bridge.spec.ts
            aidocs/security-audit-2026-08-13.md
            BUILDINFO.txt
          )
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${files[@]}") > dist/SHA256SUMS
          else
            (cd dist && shasum -a 256 "${files[@]}") > dist/SHA256SUMS
          fi
      - name: Package artifact with file permissions
        shell: bash
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .
      - name: Upload workflow artifact (actions/upload-artifact v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release ${{ needs.version.outputs.tag }}
    needs:
      - version
      - verify
      - minimum-rust
      - dependency-audit
      - build
    # Publishes only for a version that has no tag yet, so a repeat manual
    # dispatch rebuilds artifacts without touching the existing release.
    if: >-
      always() && needs.version.result == 'success'
      && needs.version.outputs.released == 'false'
      && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built artifacts (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          pattern: protonpass-to-bitwarden-*
          merge-multiple: false
      - name: Fail if an expected artifact is missing
        run: |
          set -euo pipefail
          for artifact in \
            protonpass-to-bitwarden-linux-x86_64 \
            protonpass-to-bitwarden-macos-x86_64 \
            protonpass-to-bitwarden-macos-aarch64 \
            protonpass-to-bitwarden-windows-x86_64; do
            test -f "dist/$artifact/$artifact.tar.gz" \
              || { echo "::error::missing $artifact"; exit 1; }
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            dist/*/*.tar.gz
